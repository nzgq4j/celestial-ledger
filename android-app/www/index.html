<!doctype html>
<html lang="en-GB" data-app="android">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111f" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'"
    />
    <title>Celestial Atlas</title>
    <style>
      :root {
        --navy: #07111f;
        --navy-raised: #0d1a2d;
        --gold: #c9a75d;
        --gold-light: #e6cf9a;
        --ivory: #f2ead8;
        --muted: #b9b2a3;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--navy);
        color: var(--ivory);
        font-family:
          "Hanken Grotesk",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px
          calc(24px + env(safe-area-inset-bottom));
        background:
          radial-gradient(
            circle at 50% 30%,
            rgba(201, 167, 93, 0.12),
            transparent 55%
          ),
          var(--navy);
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        display: block;
        margin: 0 auto 28px;
      }
      .brand {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--gold);
      }
      h1 {
        margin: 0 0 12px;
        font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
        font-weight: 500;
        font-size: 30px;
        line-height: 1.15;
      }
      p.lead {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 14px 32px;
        min-width: 160px;
        min-height: 48px;
        font: inherit;
        font-weight: 700;
        color: var(--navy);
        background: linear-gradient(120deg, #b98b38, #dfbd70 55%, #bd8f3d);
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--gold-light);
        outline-offset: 3px;
      }
      button[disabled] {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="" width="96" height="96" />
      <p class="brand">Celestial Atlas</p>
      <h1 id="title">Celestial Atlas needs a connection</h1>
      <p class="lead" id="body">
        Check your Wi-Fi or mobile data, then try again. Your chart and readings
        are waiting.
      </p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script src="origin.js"></script>
    <script src="offline.js"></script>
  </body>
</html>
